name: Build Desktop Apps

on:
  workflow_dispatch: # GitHubのWeb画面から手動実行

jobs:
  # ==============================
  # Windows ビルドタスク
  # ==============================
  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      # アイコン欠落防止ガード
      - name: Ensure Windows icons exist
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/icons/icon.ico")) {
            Write-Host "icon.ico not found. Generating temporary icon..."
            node -e '
              const fs = require("fs"); const zlib = require("zlib");
              const w = 512, h = 512, row = w * 4 + 1; const raw = Buffer.alloc(row * h);
              for (let y = 0; y < h; y++) {
                raw[y * row] = 0;
                for (let x = 0; x < w; x++) {
                  const i = y * row + 1 + x * 4;
                  raw[i] = 4; raw[i+1] = 211; raw[i+2] = 97; raw[i+3] = 255;
                }
              }
              const comp = zlib.deflateSync(raw);
              function crc32(b) { let c = -1; for (let i = 0; i < b.length; i++) { c ^= b[i]; for (let j = 0; j < 8; j++) c = (c >>> 1) ^ ((c & 1) ? 0xedb88320 : 0); } return (c ^ -1) >>> 0; }
              function chunk(t, d) { const l = Buffer.alloc(4); l.writeUInt32BE(d.length, 0); const tb = Buffer.from(t, "ascii"); const crc = Buffer.alloc(4); crc.writeUInt32BE(crc32(Buffer.concat([tb, d])), 0); return Buffer.concat([l, tb, d, crc]); }
              const sig = Buffer.from([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]);
              const ihdr = Buffer.alloc(13); ihdr.writeUInt32BE(w, 0); ihdr.writeUInt32BE(h, 4); ihdr[8] = 8; ihdr[9] = 6;
              fs.writeFileSync("temp-icon.png", Buffer.concat([sig, chunk("IHDR", ihdr), chunk("IDAT", comp), chunk("IEND", Buffer.alloc(0))]));
            '
            npx @tauri-apps/cli icon temp-icon.png
            Remove-Item temp-icon.png
          }

      # 依存クレート更新
      - name: Update Cargo dependencies
        run: cargo update
        working-directory: ./src-tauri

      - name: Build Tauri App (Release)
        run: npm run tauri build

      # 生成されたバイナリ名を確実に Spectrogram-Visualizer.exe に揃える
      - name: Ensure standalone exe name
        shell: pwsh
        run: |
          $targetDir = "src-tauri/target/release"
          $exe = Get-ChildItem "$targetDir/*.exe" | Where-Object { $_.Name -notlike "*build*" -and $_.Name -notlike "*installer*" } | Select-Object -First 1
          if ($exe) {
            Write-Host "Found standalone binary: $($exe.FullName)"
            Copy-Item $exe.FullName "$targetDir/Spectrogram-Visualizer.exe" -Force
          }
          Get-ChildItem "$targetDir/*.exe"

      # 単体実行ファイル (.exe) およびインストーラー (.exe / .msi) を出力
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Spectrogram-Visualizer-Windows-x64
          path: |
            src-tauri/target/release/Spectrogram-Visualizer.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  # ==============================
  # macOS ビルドタスク (Universal版)
  # ==============================
  build-macos:
    name: Build for macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain (Universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Update Cargo dependencies
        run: cargo update
        working-directory: ./src-tauri

      - name: Build Tauri App (Universal Release)
        run: npm run tauri build -- --target universal-apple-darwin

      # .app バンドルを tar.gz 形式で圧縮
      - name: Package .app as tar.gz
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          tar -czf "$GITHUB_WORKSPACE/Spectrogram-Visualizer-macOS-Universal.app.tar.gz" *.app

      # .dmg と .app.tar.gz を出力
      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Spectrogram-Visualizer-macOS-Universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            Spectrogram-Visualizer-macOS-Universal.app.tar.gz
          if-no-files-found: error
          retention-days: 14