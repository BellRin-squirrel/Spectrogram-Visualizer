name: Build Desktop Apps

on:
  workflow_dispatch: # GitHubのWeb画面から手動で実行

jobs:
  # ==============================
  # Windows ビルドタスク
  # ==============================
  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ビルド時間を劇的に短縮するRustキャッシュ
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build Tauri App (Release)
        run: npm run tauri build

      # 生成された .exe と .msi を Artifacts に保存
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Spectrogram-App-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  # ==============================
  # macOS ビルドタスク
  # ==============================
  build-macos:
    name: Build for macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ビルド時間を短縮するRustキャッシュ
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build Tauri App (Release)
        run: npm run tauri build

      # 生成された .dmg を Artifacts に保存
      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Spectrogram-App-macOS-AppleSilicon
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14