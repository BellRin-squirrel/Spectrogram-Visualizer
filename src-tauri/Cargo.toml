[package]
name = "Spectrogram-Visualizer"
version = "0.3.2"
description = "Spectrogram Visualizer in Tauri"
authors = ["BellRin"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
symphonia = { version = "0.5.4", features = ["all"] }
